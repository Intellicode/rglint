kind = "schema"
schema = """
        type AEdge {
          node: Int!
          cursor: String!
        }
        type AConnection {
          edges: [AEdge]
        }
        type User {
          comments: [Int]
          likes: [Int!]
          messages: [Int]!
          posts: [Int!]!
        }
      """

[options]
listTypeCanWrapOnlyEdgeType = true
