query StorefrontOverview($handle: String!, $first: Int = 10) {
  product(handle: $handle) {
    id
    title
    handle
    description
    availableForSale
    priceRange { minVariantPrice { id amount currencyCode } maxVariantPrice { id amount currencyCode } }
    images(first: $first) { pageInfo { hasNextPage } nodes { id url altText width height } }
    variants(first: $first) {
      nodes { id title sku availableForSale price { id amount currencyCode } selectedOptions { name value } }
    }
  }
}
